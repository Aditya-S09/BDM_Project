/* ═══════ SCORING ENGINE ═══════ */
const LEVEL_SCORES = {
  0: [0, 0, 0],
  1: [0, 12, 25],
  2: [25, 37, 50],
  3: [50, 67, 85]
};
const PAR_W = {
  policy: 0.25,
  actions: 0.40,
  results: 0.35
};
function calcThemeRange(scores, parTypes) {
  const groups = {
    policy: [],
    actions: [],
    results: []
  };
  scores.forEach((s, i) => {
    const [lo, mi, hi] = LEVEL_SCORES[s] || LEVEL_SCORES[0];
    groups[parTypes[i]].push({
      lo,
      mi,
      hi
    });
  });
  let low = 0,
    mid = 0,
    high = 0;
  ['policy', 'actions', 'results'].forEach(type => {
    const items = groups[type];
    if (!items.length) {
      if (type === 'results') {
        low += 60 * PAR_W[type];
        mid += 75 * PAR_W[type];
        high += 75 * PAR_W[type];
      }
      return;
    }
    const aL = items.reduce((a, b) => a + b.lo, 0) / items.length;
    const aM = items.reduce((a, b) => a + b.mi, 0) / items.length;
    const aH = items.reduce((a, b) => a + b.hi, 0) / items.length;
    if (type === 'results') {
      low += (aL + 75) / 2 * PAR_W[type];
      mid += (aM + 75) / 2 * PAR_W[type];
      high += (aH + 75) / 2 * PAR_W[type];
    } else {
      low += aL * PAR_W[type];
      mid += aM * PAR_W[type];
      high += aH * PAR_W[type];
    }
  });
  return {
    low: Math.round(low),
    mid: Math.round(mid),
    high: Math.round(high)
  };
}
